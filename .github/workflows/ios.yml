name: iOS Build via EAS

on:
  workflow_dispatch:
  push:
    tags:
      - ios-*

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI v7
        run: npm install -g eas-cli@7.8.6

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Restore shared schemes
        run: |
          mkdir -p ios/App/App.xcworkspace/xcshareddata/xcschemes
          cp ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme ios/App/App.xcworkspace/xcshareddata/xcschemes/App.xcscheme

      - name: Build iOS with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd ios/App
          cp ../../app.json ./app.json
          cp ../../eas.json ./eas.json
          eas build --platform ios --profile production --non-interactive --no-wait
