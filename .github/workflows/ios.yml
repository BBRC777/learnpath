name: iOS Build via EAS

on:
  workflow_dispatch:
  push:
    tags:
      - ios-*

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Restore shared schemes
        run: |
          mkdir -p ios/App/App.xcworkspace/xcshareddata/xcschemes
          cp ios/App/App.xcodeproj/xcshareddata/xcschemes/App.xcscheme ios/App/App.xcworkspace/xcshareddata/xcschemes/App.xcscheme
          echo "=== Schemes after restore ==="
          cd ios/App
          xcodebuild -list -workspace App.xcworkspace 2>&1 | grep -A 20 "Schemes:"

      - name: Build iOS with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cp app.json ios/App/app.json
          cp eas.json ios/App/eas.json
          cd ios/App
          eas build --platform ios --profile production --non-interactive --no-wait
