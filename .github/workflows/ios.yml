name: iOS Build via EAS

on:
  workflow_dispatch:
  push:
    tags:
      - ios-*

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install --repo-update

      - name: Debug EAS detection
        run: |
          cd ios/App
          echo "=== Schemes via xcodebuild ==="
          xcodebuild -list -workspace App.xcworkspace 2>&1 | head -20
          echo "=== EAS version ==="
          eas --version
          echo "=== node_modules eas location ==="
          which eas
          echo "=== Try EAS with verbose ==="
          EXPO_TOKEN=${{ secrets.EXPO_TOKEN }} eas build --platform ios --profile production --non-interactive --no-wait --json 2>&1 || true
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
